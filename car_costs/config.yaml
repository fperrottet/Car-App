name: Frais de voiture
version: "0.4.0"
slug: car_costs
description: Dépenses, contrats, entretien, pneus, batterie et rappels de la voiture, avec le coût par km
url: https://github.com/fperrottet/car-app
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:car-electric
panel_title: Frais voiture
# Accès à l'API de Home Assistant, utilisé à l'étape 2 (odomètre, EVCC).
homeassistant_api: true
# Pour copier la carte Lovelace dans /config/www (ressource /local/car-costs-card.js).
map:
  - type: homeassistant_config
    read_only: false
